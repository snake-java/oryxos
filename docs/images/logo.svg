<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80">
  <rect width="240" height="80" fill="#0a0a12"/>

  <defs>
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0088FF"/>
      <stop offset="100%" style="stop-color:#00CCFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 同心圆图标 -->
  <g transform="translate(32, 40)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#FF6B00" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#FF8C00" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#FF6B00" stroke-width="0.8" opacity="0.4"/>
    <circle cx="0" cy="0" r="5" fill="#FF6B00"/>
    <ellipse cx="0" cy="0" rx="30" ry="8" fill="none" stroke="url(#bGrad)" stroke-width="0.8" opacity="0.5" transform="rotate(-15)"/>
    <circle cx="26" cy="0" r="1.5" fill="#00CCFF" filter="url(#glow)"/>
  </g>

  <!-- 能量线 -->
  <path d="M62,28 Q100,22 140,28" fill="none" stroke="url(#oGrad)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M62,52 Q95,56 130,52" fill="none" stroke="url(#bGrad)" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- ryx OS -->
  <text x="72" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#E8F4FC">ryx</text>
  <text x="134" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FF6B00" filter="url(#glow)">OS</text>
</svg>
