<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 65">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FF8500"/>
    </linearGradient>
  </defs>

  <!-- O -->
  <text x="5" y="45" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="url(#textGrad)">O</text>

  <!-- ryx -->
  <text x="35" y="45" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="url(#textGrad)">ryx</text>

  <!-- 图形 -->
  <g transform="translate(108, 30)">
    <!-- 外圈 -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="url(#circleGrad)" stroke-width="1.8" opacity="0.4"/>
    <!-- 内圈 -->
    <circle cx="0" cy="0" r="9" fill="none" stroke="url(#circleGrad)" stroke-width="1.4"/>
    <!-- 中心点 -->
    <circle cx="0" cy="0" r="4" fill="url(#circleGrad)"/>
    <!-- 弧线 -->
    <path d="M0,-12 Q7,-6 6,9" fill="none" stroke="url(#circleGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 连接点 -->
    <circle cx="0" cy="-15" r="2" fill="url(#circleGrad)"/>
    <circle cx="15" cy="0" r="2" fill="url(#circleGrad)" opacity="0.6"/>
    <circle cx="0" cy="15" r="2" fill="url(#circleGrad)" opacity="0.4"/>
    <circle cx="-15" cy="0" r="2" fill="url(#circleGrad)" opacity="0.6"/>
  </g>

  <!-- S -->
  <text x="135" y="45" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="url(#textGrad)">S</text>
</svg>
