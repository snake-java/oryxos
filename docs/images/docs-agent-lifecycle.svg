<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 350">
  <rect width="750" height="350" fill="#fafafa"/>

  <text x="375" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Agent 生命周期管理</text>

  <!-- Agent Directory -->
  <rect x="30" y="50" width="160" height="100" rx="6" fill="#fff" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="110" y="72" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#E65100">Agent 目录</text>
  <text x="110" y="90" font-family="Courier New, monospace" font-size="8" text-anchor="middle" fill="#666">.oryxos/agents/&lt;name&gt;/</text>
  <text x="45" y="108" font-family="Arial, sans-serif" font-size="8" fill="#666">• AGENT.md</text>
  <text x="45" y="120" font-family="Arial, sans-serif" font-size="8" fill="#666">• skills/*.md</text>
  <text x="45" y="132" font-family="Arial, sans-serif" font-size="8" fill="#666">• scripts/*</text>

  <!-- Two Paths -->
  <line x1="190" y1="100" x2="240" y2="100" stroke="#FF6B00" stroke-width="1.5"/>

  <rect x="245" y="80" width="90" height="40" rx="4" fill="#FFF3E0" stroke="#FF9800"/>
  <text x="290" y="100" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#E65100">手工丢目录</text>

  <line x1="190" y1="100" x2="240" y2="100" stroke="#FF6B00" stroke-width="1.5"/>
  <line x1="240" y1="100" x2="240" y2="160" stroke="#FF6B00" stroke-width="1.5"/>

  <rect x="245" y="160" width="90" height="40" rx="4" fill="#E3F2FD" stroke="#2196F3"/>
  <text x="290" y="178" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1565C0">API 上传</text>
  <text x="290" y="192" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">POST /agents</text>

  <!-- Converge -->
  <line x1="335" y1="100" x2="380" y2="100" stroke="#FF6B00" stroke-width="1.5"/>
  <line x1="290" y1="180" x2="335" y2="180" stroke="#FF6B00" stroke-width="1.5"/>
  <line x1="335" y1="180" x2="380" y2="180" stroke="#FF6B00" stroke-width="1.5"/>

  <!-- AgentLoader -->
  <rect x="385" y="55" width="130" height="130" rx="6" fill="#FF6B00"/>
  <text x="450" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">AgentLoader</text>
  <text x="450" y="105" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#FFE0B2">deriveProfile()</text>
  <text x="450" y="125" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#FFE0B2">扫描 agents/</text>
  <text x="450" y="145" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#FFE0B2">解析 AGENT.md</text>

  <!-- Arrow to ProfileRegistry -->
  <line x1="515" y1="120" x2="560" y2="120" stroke="#9C27B0" stroke-width="1.5"/>

  <!-- ProfileRegistry -->
  <rect x="565" y="55" width="120" height="130" rx="6" fill="#fff" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="625" y="82" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#7B1FA2">Profile</text>
  <text x="625" y="98" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#7B1FA2">Registry</text>
  <text x="625" y="125" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">注册 Profile</text>
  <text x="625" y="145" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">运行时动态增删</text>

  <!-- Arrow to Scheduler -->
  <line x1="625" y1="185" x2="625" y2="215" stroke="#4CAF50" stroke-width="1.5"/>

  <!-- AgentScheduler -->
  <rect x="545" y="220" width="160" height="65" rx="6" fill="#fff" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="625" y="245" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2E7D32">AgentScheduler</text>
  <text x="625" y="265" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">注册定时任务</text>
  <text x="625" y="280" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">CronTrigger 驱动</text>

  <!-- WorkspaceWatcher -->
  <rect x="385" y="220" width="145" height="65" rx="6" fill="#fff" stroke="#2196F3" stroke-width="1.5"/>
  <text x="457" y="245" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565C0">WorkspaceWatcher</text>
  <text x="457" y="265" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">监听目录变化</text>
  <text x="457" y="280" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">实时注册/注销</text>

  <!-- Arrow from WorkspaceWatcher -->
  <line x1="457" y1="220" x2="457" y2="185" stroke="#2196F3" stroke-width="1.5"/>
  <line x1="457" y1="185" x2="565" y2="185" stroke="#2196F3" stroke-width="1.5"/>

  <!-- Legend -->
  <g transform="translate(30, 310)">
    <rect width="10" height="10" fill="#FF6B00"/>
    <text x="15" y="9" font-family="Arial, sans-serif" font-size="8" fill="#666">录入路径</text>
    <rect x="80" width="10" height="10" fill="#9C27B0"/>
    <text x="95" y="9" font-family="Arial, sans-serif" font-size="8" fill="#666">Profile 注册</text>
    <rect x="170" width="10" height="10" fill="#4CAF50"/>
    <text x="185" y="9" font-family="Arial, sans-serif" font-size="8" fill="#666">定时任务</text>
    <rect x="250" width="10" height="10" fill="#2196F3"/>
    <text x="265" y="9" font-family="Arial, sans-serif" font-size="8" fill="#666">运行时监听</text>
  </g>
</svg>
