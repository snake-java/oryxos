<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <linearGradient id="loopBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e8e8e8"/>
    </linearGradient>
  </defs>

  <rect width="700" height="380" fill="url(#loopBg)"/>

  <text x="350" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">ReAct 循环：Reason + Act + Observe</text>

  <!-- Step 1 -->
  <rect x="200" y="40" width="300" height="45" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
  <text x="350" y="58" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565C0">1. 接收用户消息</text>
  <text x="350" y="73" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">追加到 Session 对话历史</text>

  <!-- Arrow -->
  <line x1="350" y1="85" x2="350" y2="105" stroke="#999" stroke-width="1.5"/>

  <!-- Step 2 -->
  <rect x="160" y="110" width="380" height="55" rx="6" fill="#fff" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="350" y="128" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#7B1FA2">2. 组装 Prompt</text>
  <text x="180" y="148" font-family="Arial, sans-serif" font-size="9" fill="#666">• System Prompt (AGENT.md + Bootstrap)</text>
  <text x="180" y="160" font-family="Arial, sans-serif" font-size="9" fill="#666">• Memory 注入 (会话 + 长期)</text>

  <!-- Arrow -->
  <line x1="350" y1="165" x2="350" y2="185" stroke="#999" stroke-width="1.5"/>

  <!-- Step 3 -->
  <rect x="160" y="190" width="380" height="45" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="350" y="208" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2E7D32">3. 调用 LLM Provider</text>
  <text x="350" y="223" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">ProviderService → ChatModel</text>

  <!-- Arrow to Decision -->
  <line x1="350" y1="235" x2="350" y2="255" stroke="#999" stroke-width="1.5"/>

  <!-- Decision Diamond -->
  <polygon points="350,260 395,295 350,330 305,295" fill="#fff" stroke="#4CAF50" stroke-width="2"/>
  <text x="350" y="290" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2E7D32">Tool?</text>

  <!-- No Tool Path -->
  <line x1="395" y1="295" x2="450" y2="295" stroke="#4CAF50" stroke-width="2"/>
  <rect x="455" y="270" width="160" height="50" rx="6" fill="#4CAF50"/>
  <text x="535" y="292" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">返回最终响应</text>
  <text x="535" y="310" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#E8F5E9">完成</text>

  <!-- Yes Tool Path -->
  <line x1="305" y1="295" x2="240" y2="295" stroke="#FF9800" stroke-width="2"/>
  <line x1="240" y1="295" x2="240" y2="180" stroke="#FF9800" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="240" y1="180" x2="160" y2="180" stroke="#FF9800" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Tool Execution -->
  <rect x="70" y="155" width="170" height="70" rx="6" fill="#FF9800"/>
  <text x="155" y="178" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">4. 执行 Tool</text>
  <text x="85" y="198" font-family="Arial, sans-serif" font-size="9" fill="#fff">• ToolExecutor 调度</text>
  <text x="85" y="212" font-family="Arial, sans-serif" font-size="9" fill="#fff">• Sandbox 校验</text>

  <!-- Iteration Counter -->
  <rect x="40" y="40" width="80" height="35" rx="4" fill="#FFF3E0" stroke="#FF9800"/>
  <text x="80" y="58" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#E65100">迭代计数</text>
  <text x="80" y="70" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">MAX=10</text>

  <!-- Legend -->
  <g transform="translate(50, 350)">
    <rect width="12" height="12" fill="#4CAF50"/>
    <text x="18" y="10" font-family="Arial, sans-serif" font-size="9" fill="#666">Reason</text>
    <rect x="70" width="12" height="12" fill="#FF9800"/>
    <text x="88" y="10" font-family="Arial, sans-serif" font-size="9" fill="#666">Act</text>
    <rect x="120" width="12" height="12" fill="#2196F3"/>
    <text x="138" y="10" font-family="Arial, sans-serif" font-size="9" fill="#666">Observe</text>
  </g>
</svg>
