<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300">
  <rect width="650" height="300" fill="#fafafa"/>

  <text x="325" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Tool 调用流程</text>

  <!-- LLM Decision -->
  <rect x="200" y="40" width="250" height="45" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="325" y="62" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2E7D32">LLM 决定调用 Tool</text>
  <text x="325" y="77" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Function Calling</text>

  <!-- Arrow -->
  <line x1="325" y1="85" x2="325" y2="110" stroke="#999" stroke-width="1.5"/>

  <!-- ToolExecutor -->
  <rect x="200" y="115" width="250" height="45" rx="6" fill="#2196F3"/>
  <text x="325" y="137" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">ToolExecutor</text>
  <text x="325" y="152" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#E3F2FD">查找并执行 Tool</text>

  <!-- Arrow -->
  <line x1="325" y1="160" x2="325" y2="185" stroke="#999" stroke-width="1.5"/>

  <!-- Sandbox Check -->
  <rect x="200" y="190" width="250" height="45" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
  <text x="325" y="212" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#E65100">Sandbox.enforce()</text>
  <text x="325" y="227" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">白名单校验</text>

  <!-- Decision -->
  <polygon points="325,250 360,280 325,310 290,280" fill="#fff" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="325" y="278" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#2E7D32">通过?</text>

  <!-- Pass -->
  <line x1="360" y1="280" x2="420" y2="280" stroke="#4CAF50" stroke-width="2"/>
  <rect x="425" y="255" width="160" height="50" rx="6" fill="#4CAF50"/>
  <text x="505" y="277" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">执行 Tool</text>
  <text x="505" y="295" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#E8F5E9">返回结果给 LLM</text>

  <!-- Fail -->
  <line x1="290" y1="280" x2="180" y2="280" stroke="#f44336" stroke-width="2"/>
  <line x1="180" y1="280" x2="180" y2="75" stroke="#f44336" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="180" y1="75" x2="200" y2="75" stroke="#f44336" stroke-width="2" stroke-dasharray="4,2"/>

  <rect x="40" y="50" width="140" height="45" rx="6" fill="#f44336"/>
  <text x="110" y="72" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">拒绝执行</text>
  <text x="110" y="87" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#FFCDD2">返回错误给 LLM</text>

  <!-- Tool Types -->
  <text x="50" y="150" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Tool 类型</text>
  <g font-family="Arial, sans-serif" font-size="9" text-anchor="middle">
    <rect x="40" y="160" width="70" height="22" rx="3" fill="#E3F2FD"/>
    <text x="75" y="175" fill="#1565C0">内置 Tool</text>

    <rect x="40" y="190" width="70" height="22" rx="3" fill="#E8F5E9"/>
    <text x="75" y="205" fill="#2E7D32">MCP Tool</text>

    <rect x="40" y="220" width="70" height="22" rx="3" fill="#FFF3E0"/>
    <text x="75" y="235" fill="#E65100">@Tool Bean</text>
  </g>

  <!-- ToolRegistry -->
  <rect x="525" y="115" width="100" height="50" rx="4" fill="#F3E5F5" stroke="#9C27B0"/>
  <text x="570" y="138" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#7B1FA2">ToolRegistry</text>
  <text x="570" y="155" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">OryxTool 注册表</text>
</svg>
