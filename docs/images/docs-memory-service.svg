<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
  <rect width="700" height="300" fill="#fafafa"/>

  <text x="350" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Memory 架构</text>

  <!-- MemoryService -->
  <rect x="220" y="45" width="260" height="55" rx="8" fill="#9C27B0"/>
  <text x="350" y="72" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">MemoryService</text>
  <text x="350" y="90" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#E1BEE7">三层记忆统一门面</text>

  <!-- Arrows -->
  <line x1="280" y1="100" x2="130" y2="135" stroke="#ccc" stroke-width="1.5"/>
  <line x1="350" y1="100" x2="350" y2="135" stroke="#ccc" stroke-width="1.5"/>
  <line x1="420" y1="100" x2="570" y2="135" stroke="#ccc" stroke-width="1.5"/>

  <!-- Session Memory -->
  <rect x="40" y="140" width="180" height="80" rx="6" fill="#fff" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="130" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2E7D32">会话记忆</text>
  <text x="130" y="185" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">当前对话完整历史</text>
  <text x="130" y="200" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">SQLite 持久化</text>
  <text x="130" y="215" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#999">Channel + User + Profile</text>

  <!-- Long Term Memory -->
  <rect x="260" y="140" width="180" height="80" rx="6" fill="#fff" stroke="#FF9800" stroke-width="1.5"/>
  <text x="350" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#E65100">长期记忆</text>
  <text x="350" y="185" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">MEMORY.md 文件</text>
  <text x="350" y="200" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">跨对话保留</text>
  <text x="350" y="215" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#999">核心 + 归档记忆</text>

  <!-- Situational Memory -->
  <rect x="480" y="140" width="180" height="80" rx="6" fill="#fff" stroke="#2196F3" stroke-width="1.5"/>
  <text x="570" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1565C0">情景记忆</text>
  <text x="570" y="185" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">任务过程中学到的东西</text>
  <text x="570" y="200" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">扩展阶段</text>
  <text x="570" y="215" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#999">未来规划</text>

  <!-- Backend labels -->
  <text x="130" y="245" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">SessionManager</text>
  <text x="350" y="245" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">LongTermMemory</text>

  <!-- Backend options -->
  <rect x="260" y="252" width="180" height="30" rx="4" fill="#FFF3E0"/>
  <text x="350" y="272" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#E65100">Markdown / Sqlite / Mem0</text>

  <!-- Legend -->
  <g transform="translate(40, 285)">
    <rect width="10" height="10" fill="#4CAF50"/>
    <text x="15" y="9" font-family="Arial, sans-serif" font-size="8" fill="#666">核心阶段</text>
    <rect x="80" width="10" height="10" fill="#FF9800"/>
    <text x="95" y="9" font-family="Arial, sans-serif" font-size="8" fill="#666">核心阶段</text>
    <rect x="150" width="10" height="10" fill="#2196F3"/>
    <text x="165" y="9" font-family="Arial, sans-serif" font-size="8" fill="#666">扩展阶段</text>
  </g>
</svg>
