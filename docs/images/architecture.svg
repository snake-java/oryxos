<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">OryxOS 整体架构</text>

  <!-- Layer 1: 接入层 -->
  <rect x="40" y="50" width="720" height="70" rx="8" fill="#fff" stroke="#FF6B00" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">接入层</text>

  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <rect x="70" y="82" width="100" height="28" rx="4" fill="#FFF3E0"/>
    <text x="120" y="100" fill="#E65100">CLI Channel</text>

    <rect x="185" y="82" width="100" height="28" rx="4" fill="#FFF3E0"/>
    <text x="235" y="100" fill="#E65100">Web Service</text>

    <rect x="300" y="82" width="130" height="28" rx="4" fill="#FFF3E0"/>
    <text x="365" y="100" fill="#E65100">AgentScheduler</text>

    <rect x="445" y="82" width="100" height="28" rx="4" fill="#FFF3E0"/>
    <text x="495" y="100" fill="#E65100">Channel X</text>

    <rect x="560" y="82" width="80" height="28" rx="4" fill="#FFF3E0"/>
    <text x="600" y="100" fill="#E65100">...</text>
  </g>

  <!-- Arrow 1->2 -->
  <line x1="400" y1="120" x2="400" y2="150" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Layer 2: Agent 层 -->
  <rect x="40" y="155" width="720" height="70" rx="8" fill="#fff" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">Agent 层</text>

  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <rect x="70" y="187" width="120" height="28" rx="4" fill="#E8F5E9"/>
    <text x="130" y="205" fill="#2E7D32">AgentService</text>

    <rect x="205" y="187" width="120" height="28" rx="4" fill="#E8F5E9"/>
    <text x="265" y="205" fill="#2E7D32">ReActLoop</text>

    <rect x="340" y="187" width="120" height="28" rx="4" fill="#E8F5E9"/>
    <text x="400" y="205" fill="#2E7D32">PromptBuilder</text>

    <rect x="475" y="187" width="120" height="28" rx="4" fill="#E8F5E9"/>
    <text x="535" y="205" fill="#2E7D32">ToolExecutor</text>
  </g>

  <!-- Arrow 2->3 -->
  <line x1="400" y1="225" x2="400" y2="255" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Layer 3: 能力层 -->
  <rect x="40" y="260" width="720" height="90" rx="8" fill="#fff" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="280" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565C0">能力层</text>

  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <rect x="70" y="292" width="140" height="45" rx="4" fill="#E3F2FD"/>
    <text x="140" y="310" fill="#1565C0">Provider</text>
    <text x="140" y="325" font-size="8" fill="#888">LLM 调用</text>

    <rect x="225" y="292" width="140" height="45" rx="4" fill="#E3F2FD"/>
    <text x="295" y="310" fill="#1565C0">Memory</text>
    <text x="295" y="325" font-size="8" fill="#888">三层记忆</text>

    <rect x="380" y="292" width="140" height="45" rx="4" fill="#E3F2FD"/>
    <text x="450" y="310" fill="#1565C0">Tool</text>
    <text x="450" y="325" font-size="8" fill="#888">内置 + MCP + Plugin</text>

    <rect x="535" y="292" width="140" height="45" rx="4" fill="#FFF3E0" stroke="#FF9800"/>
    <text x="605" y="310" fill="#E65100">Notify</text>
    <text x="605" y="325" font-size="8" fill="#888">通知推送</text>
  </g>

  <!-- Arrow 3->4 -->
  <line x1="400" y1="350" x2="400" y2="380" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Layer 4: 基础层 -->
  <rect x="40" y="385" width="720" height="90" rx="8" fill="#fff" stroke="#9C27B0" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="405" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7B1FA2">基础层</text>

  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <rect x="70" y="417" width="110" height="45" rx="4" fill="#F3E5F5"/>
    <text x="125" y="435" fill="#7B1FA2">Profile</text>
    <text x="125" y="450" font-size="8" fill="#888">配置管理</text>

    <rect x="195" y="417" width="110" height="45" rx="4" fill="#F3E5F5"/>
    <text x="250" y="435" fill="#7B1FA2">Context</text>
    <text x="250" y="450" font-size="8" fill="#888">Bootstrap</text>

    <rect x="320" y="417" width="110" height="45" rx="4" fill="#F3E5F5"/>
    <text x="375" y="435" fill="#7B1FA2">Session</text>
    <text x="375" y="450" font-size="8" fill="#888">SQLite 持久化</text>

    <rect x="445" y="417" width="110" height="45" rx="4" fill="#F3E5F5"/>
    <text x="500" y="435" fill="#7B1FA2">Config</text>
    <text x="500" y="450" font-size="8" fill="#888">配置与密钥</text>

    <rect x="570" y="417" width="110" height="45" rx="4" fill="#E8F5E9" stroke="#4CAF50"/>
    <text x="625" y="435" fill="#2E7D32">Sandbox</text>
    <text x="625" y="450" font-size="8" fill="#888">Whitelist</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 485)" font-family="Arial, sans-serif" font-size="9">
    <rect width="10" height="10" fill="#FF6B00"/>
    <text x="15" y="9" fill="#666">接入层</text>
    <rect x="70" width="10" height="10" fill="#4CAF50"/>
    <text x="85" y="9" fill="#666">Agent 层</text>
    <rect x="130" width="10" height="10" fill="#2196F3"/>
    <text x="145" y="9" fill="#666">能力层</text>
    <rect x="190" width="10" height="10" fill="#9C27B0"/>
    <text x="205" y="9" fill="#666">基础层</text>
  </g>

  <!-- External -->
  <text x="40" y="25" font-family="Arial, sans-serif" font-size="9" fill="#999">外部系统：LLM Provider | MCP Server | Enterprise IT | Notify Channel</text>
</svg>
