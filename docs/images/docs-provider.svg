<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280">
  <rect width="700" height="280" fill="#fafafa"/>

  <text x="350" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Provider 架构</text>

  <!-- ReAct Loop -->
  <rect x="30" y="70" width="120" height="50" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="90" y="93" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2E7D32">ReAct Loop</text>
  <text x="90" y="108" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">调用 LLM</text>

  <!-- Arrow -->
  <line x1="150" y1="95" x2="195" y2="95" stroke="#2196F3" stroke-width="1.5"/>

  <!-- ProviderService -->
  <rect x="200" y="55" width="140" height="80" rx="6" fill="#2196F3"/>
  <text x="270" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">ProviderService</text>
  <text x="270" y="100" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#E3F2FD">显式映射</text>
  <text x="270" y="115" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#E3F2FD">Map&lt;String, ChatModel&gt;</text>

  <!-- Arrow -->
  <line x1="340" y1="95" x2="385" y2="95" stroke="#2196F3" stroke-width="1.5"/>

  <!-- ChatModel -->
  <rect x="390" y="55" width="120" height="80" rx="6" fill="#fff" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="450" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#7B1FA2">ChatModel</text>
  <text x="450" y="100" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Spring AI</text>
  <text x="450" y="115" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Provider 抽象</text>

  <!-- Arrow -->
  <line x1="450" y1="135" x2="450" y2="165" stroke="#9C27B0" stroke-width="1.5"/>

  <!-- LLM Providers -->
  <text x="450" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">LLM Provider API</text>

  <g font-family="Arial, sans-serif" font-size="9" text-anchor="middle">
    <rect x="50" y="200" width="80" height="28" rx="4" fill="#E3F2FD"/>
    <text x="90" y="218" fill="#1565C0">DeepSeek</text>

    <rect x="145" y="200" width="80" height="28" rx="4" fill="#E3F2FD"/>
    <text x="185" y="218" fill="#1565C0">Qwen</text>

    <rect x="240" y="200" width="80" height="28" rx="4" fill="#E3F2FD"/>
    <text x="280" y="218" fill="#1565C0">Kimi</text>

    <rect x="335" y="200" width="80" height="28" rx="4" fill="#E3F2FD"/>
    <text x="375" y="218" fill="#1565C0">Zhipu</text>

    <rect x="430" y="200" width="80" height="28" rx="4" fill="#E3F2FD"/>
    <text x="470" y="218" fill="#1565C0">Claude</text>

    <rect x="525" y="200" width="80" height="28" rx="4" fill="#E3F2FD"/>
    <text x="565" y="218" fill="#1565C0">GPT</text>
  </g>

  <!-- Config -->
  <rect x="520" y="55" width="110" height="40" rx="4" fill="#FFF3E0" stroke="#FF9800"/>
  <text x="575" y="75" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#E65100">application.yml</text>
  <text x="575" y="88" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">API Key / Base URL</text>
</svg>
