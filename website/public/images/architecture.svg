<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f5f5f5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">OryxOS 整体架构</text>

  <!-- Layer 1: 接入层 -->
  <rect x="40" y="45" width="720" height="65" rx="8" fill="#fff" stroke="#FF6B00" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="65" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">接入层</text>

  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <rect x="60" y="78" width="90" height="24" rx="4" fill="#FFF3E0"/>
    <text x="105" y="94" fill="#E65100">CLI Channel</text>

    <rect x="165" y="78" width="90" height="24" rx="4" fill="#FFF3E0"/>
    <text x="210" y="94" fill="#E65100">Web Service</text>

    <rect x="270" y="78" width="110" height="24" rx="4" fill="#FFF3E0"/>
    <text x="325" y="94" fill="#E65100">AgentScheduler</text>

    <rect x="395" y="78" width="90" height="24" rx="4" fill="#FFF3E0"/>
    <text x="440" y="94" fill="#E65100">Channel X</text>

    <rect x="500" y="78" width="70" height="24" rx="4" fill="#FFF3E0"/>
    <text x="535" y="94" fill="#E65100">...</text>
  </g>

  <!-- Arrow -->
  <line x1="400" y1="115" x2="400" y2="135" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Layer 2: Agent 层 -->
  <rect x="40" y="140" width="720" height="65" rx="8" fill="#fff" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">Agent 层</text>

  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <rect x="60" y="173" width="100" height="24" rx="4" fill="#E8F5E9"/>
    <text x="110" y="189" fill="#2E7D32">AgentService</text>

    <rect x="175" y="173" width="100" height="24" rx="4" fill="#E8F5E9"/>
    <text x="225" y="189" fill="#2E7D32">ReActLoop</text>

    <rect x="290" y="173" width="110" height="24" rx="4" fill="#E8F5E9"/>
    <text x="345" y="189" fill="#2E7D32">PromptBuilder</text>

    <rect x="415" y="173" width="100" height="24" rx="4" fill="#E8F5E9"/>
    <text x="465" y="189" fill="#2E7D32">ToolExecutor</text>
  </g>

  <!-- Arrow -->
  <line x1="400" y1="210" x2="400" y2="230" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Layer 3: 能力层 -->
  <rect x="40" y="235" width="720" height="80" rx="8" fill="#fff" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="255" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565C0">能力层</text>

  <g font-family="Arial, sans-serif" font-size="9" text-anchor="middle">
    <rect x="60" y="268" width="120" height="38" rx="4" fill="#E3F2FD"/>
    <text x="120" y="283" fill="#1565C0">Provider</text>
    <text x="120" y="297" font-size="8" fill="#888">LLM 调用</text>

    <rect x="195" y="268" width="120" height="38" rx="4" fill="#E3F2FD"/>
    <text x="255" y="283" fill="#1565C0">Memory</text>
    <text x="255" y="297" font-size="8" fill="#888">三层记忆</text>

    <rect x="330" y="268" width="120" height="38" rx="4" fill="#E3F2FD"/>
    <text x="390" y="283" fill="#1565C0">Tool</text>
    <text x="390" y="297" font-size="8" fill="#888">内置 + MCP</text>

    <rect x="465" y="268" width="120" height="38" rx="4" fill="#FFF3E0" stroke="#FF9800"/>
    <text x="525" y="283" fill="#E65100">Notify</text>
    <text x="525" y="297" font-size="8" fill="#888">通知推送</text>

    <rect x="600" y="268" width="120" height="38" rx="4" fill="#E3F2FD"/>
    <text x="660" y="283" fill="#1565C0">Sandbox</text>
    <text x="660" y="297" font-size="8" fill="#888">安全隔离</text>
  </g>

  <!-- Arrow -->
  <line x1="400" y1="320" x2="400" y2="340" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Layer 4: 基础层 -->
  <rect x="40" y="345" width="720" height="80" rx="8" fill="#fff" stroke="#9C27B0" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7B1FA2">基础层</text>

  <g font-family="Arial, sans-serif" font-size="9" text-anchor="middle">
    <rect x="60" y="378" width="95" height="38" rx="4" fill="#F3E5F5"/>
    <text x="107" y="393" fill="#7B1FA2">Profile</text>
    <text x="107" y="408" font-size="8" fill="#888">配置管理</text>

    <rect x="170" y="378" width="95" height="38" rx="4" fill="#F3E5F5"/>
    <text x="217" y="393" fill="#7B1FA2">Context</text>
    <text x="217" y="408" font-size="8" fill="#888">Bootstrap</text>

    <rect x="280" y="378" width="95" height="38" rx="4" fill="#F3E5F5"/>
    <text x="327" y="393" fill="#7B1FA2">Session</text>
    <text x="327" y="408" font-size="8" fill="#888">SQLite 持久化</text>

    <rect x="390" y="378" width="95" height="38" rx="4" fill="#F3E5F5"/>
    <text x="437" y="393" fill="#7B1FA2">Config</text>
    <text x="437" y="408" font-size="8" fill="#888">配置与密钥</text>

    <rect x="500" y="378" width="95" height="38" rx="4" fill="#F3E5F5"/>
    <text x="547" y="393" fill="#7B1FA2">Storage</text>
    <text x="547" y="408" font-size="8" fill="#888">SQLite</text>

    <rect x="610" y="378" width="95" height="38" rx="4" fill="#F3E5F5"/>
    <text x="657" y="393" fill="#7B1FA2">AgentLoader</text>
    <text x="657" y="408" font-size="8" fill="#888">目录扫描</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 440)" font-family="Arial, sans-serif" font-size="9">
    <rect width="10" height="10" fill="#FF6B00"/>
    <text x="15" y="9" fill="#666">接入层</text>
    <rect x="70" width="10" height="10" fill="#4CAF50"/>
    <text x="85" y="9" fill="#666">Agent 层</text>
    <rect x="130" width="10" height="10" fill="#2196F3"/>
    <text x="145" y="9" fill="#666">能力层</text>
    <rect x="190" width="10" height="10" fill="#9C27B0"/>
    <text x="205" y="9" fill="#666">基础层</text>
  </g>

  <!-- External -->
  <text x="40" y="465" font-family="Arial, sans-serif" font-size="9" fill="#999">外部系统：LLM Provider | MCP Server | Enterprise IT | Notify Channel | File System</text>
</svg>
