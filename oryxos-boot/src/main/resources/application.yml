spring:
  application:
    name: oryxos
  profiles:
    active: default

server:
  port: 8080

# OryxOS Workspace
oryxos:
  workspace: ${ORYXOS_WORKSPACE:.oryxos}
  data-dir: ${ORYXOS_DATA_DIR:.oryxos}

# LLM Providers - Configure your API keys via environment variables
spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}

# DeepSeek Provider
spring:
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}

# Logging
logging:
  level:
    com.oryxos: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
