# Default Profile for OryxOS
# This profile is auto-generated on first run

name: default
description: Default Agent Profile - use as template for creating new profiles

identity:
  agent_name: OryxOS Assistant
  prompt: You are a helpful AI assistant running on OryxOS.

provider:
  name: deepseek
  model: deepseek-chat
  temperature: 0.7

tools:
  - read_file
  - write_file
  - list_dir
  - shell
  - http_get
  - http_post
  - save_memory
  - recall_memory
  - notify

skills: []

mcp_servers: []

channels:
  - name: cli
    config: {}

bootstrap:
  - AGENTS.md
  - SOUL.md
  - USER.md

settings:
  max_iterations: 10
  max_history_turns: 20

sandbox:
  allowed_paths:
    - /tmp/oryxos/**
    - /home/**/oryxos/**
  allowed_commands:
    - git
    - ls
    - cat
    - echo
    - pwd
    - cd
  allowed_domains:
    - api.deepseek.com
    - api.openai.com
    - api.qwen.com
